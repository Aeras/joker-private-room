name: Reconciler Canonical Bundle

on:
  push:
    branches:
      - jk-002-reconciler-canonical-bundle

permissions:
  contents: write

jobs:
  bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Bundle canonical reconciler source
        run: |
          bun build supabase/functions/game-reconciler/index.ts \
            --target=browser \
            --format=esm \
            --external='jsr:*' \
            --outfile=supabase/functions/game-reconciler/generated.bundle.js
      - name: Commit generated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/game-reconciler/generated.bundle.js
          if git diff --cached --quiet; then
            echo "Bundle unchanged"
            exit 0
          fi
          git commit -m "JK-002: generate canonical reconciler bundle"
          git push
