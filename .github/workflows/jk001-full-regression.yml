name: JK-001 Full Regression / Release Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/domain/cards.ts'
      - 'src/domain/dealing.ts'
      - 'src/domain/declarations.ts'
      - 'src/domain/engine.ts'
      - 'src/domain/gameConfig.ts'
      - 'src/domain/scoring.ts'
      - 'src/domain/premia.ts'
      - 'src/domain/ranking.ts'
      - 'src/domain/gameState.ts'
      - 'src/domain/gameLifecycle.ts'
      - 'src/domain/gameplayCommands.ts'
      - 'src/domain/controller.ts'
      - 'src/domain/projection.ts'
      - 'src/bots/runtime.ts'
      - 'src/server/**'
      - 'src/services/authFunctions.ts'
      - 'src/services/roomFunctions.ts'
      - 'src/services/gameProjectionFunctions.ts'
      - 'src/services/gameHistoryFunctions.ts'
      - 'supabase/migrations/**'
      - 'supabase/functions/verify-player-pin/**'
      - 'supabase/functions/game-state/**'
      - 'supabase/functions/room-commands/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig*.json'
      - 'vite.config.*'

jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Full test suite
        run: bun run test
      - name: Critical architecture and security guards
        run: bun scripts/ci/full-regression-guards.ts
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: Production build
        run: bun run build
