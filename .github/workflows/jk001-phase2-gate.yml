name: JK-001 Phase 2 Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/domain/cards.ts'
      - 'src/domain/dealing.ts'
      - 'src/domain/declarations.ts'
      - 'src/domain/engine.ts'
      - 'src/domain/gameConfig.ts'
      - 'src/domain/scoring.ts'
      - 'src/domain/premia.ts'
      - 'src/domain/ranking.ts'
      - 'src/domain/gameLifecycle.ts'
      - 'src/domain/gameplayCommands.ts'
      - 'src/domain/controller.ts'
      - 'src/domain/projection.ts'
      - 'src/server/**'
      - 'src/services/authFunctions.ts'
      - 'src/services/roomFunctions.ts'
      - 'supabase/migrations/**'
      - 'supabase/functions/verify-player-pin/**'
      - 'supabase/functions/game-state/**'
      - 'supabase/functions/room-commands/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig*.json'
      - 'vite.config.*'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Full tests
        run: bun run test
      - name: Phase 2 lint
        run: >-
          bunx eslint src/domain/players.ts src/i18n/el.ts src/lib/room-feedback.ts
          src/services/roomFunctions.ts src/routes/create.tsx src/routes/join.tsx
          src/routes/lobby.tsx src/integrations/supabase/types.ts
          --rule 'prettier/prettier: off'
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: Production build
        run: bun run build
