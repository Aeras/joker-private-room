name: TMP Build Reconciler Artifact

on:
  push:
    branches:
      - jk-006-presentation-sequencing-barrier

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: node scripts/build-reconciler.mjs .artifacts/game-reconciler
      - uses: actions/upload-artifact@v4
        with:
          name: game-reconciler-pr84
          path: .artifacts/game-reconciler
          if-no-files-found: error
