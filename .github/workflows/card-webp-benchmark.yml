name: Card WebP experiment (non-production)
on:
  push:
    branches:
      - experiment/card-webp-size-20261013
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow CairoSVG
      - run: python scripts/benchmark-card-webp.py
      - uses: actions/upload-artifact@v4
        with:
          name: card-webp-benchmark
          path: .test-tmp/card-webp-benchmark/
          retention-days: 7
