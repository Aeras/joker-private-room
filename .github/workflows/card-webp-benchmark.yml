name: Card WebP experiment (non-production)
on:
  pull_request:
  push:
    branches:
      - experiment/card-webp-size-20261013
  workflow_dispatch:
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow CairoSVG
      - run: python scripts/benchmark-card-webp.py
      - name: Save lossless WebP assets in isolated folder
        run: |
          mkdir -p public/cards/webp
          cp -a .test-tmp/card-webp-benchmark/png-lossless/. public/cards/webp/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/cards/webp
          if ! git diff --cached --quiet; then
            git commit -m "assets: add lossless WebP deck alongside PNG"
            git push origin HEAD:experiment/card-webp-size-20261013
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: card-webp-benchmark
          path: .test-tmp/card-webp-benchmark/
          retention-days: 7
