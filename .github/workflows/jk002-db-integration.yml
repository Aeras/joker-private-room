name: JK-002 DB Integration
on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'tests/integration/**'
      - '.github/workflows/jk002-db-integration.yml'
jobs:
  messages:
    runs-on: ubuntu-latest
    env:
      PGPASSWORD: ci-only
    steps:
      - uses: actions/checkout@v4
      - name: Prepare local PostgreSQL (no container registry)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql postgresql-client
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER ROLE postgres WITH PASSWORD 'ci-only'"
          sudo -u postgres createdb jk002
      - name: Isolated message transport DB integration
        run: |
          psql -h localhost -U postgres -d jk002 -v ON_ERROR_STOP=1 -f tests/integration/table-messages-setup.sql
          psql -h localhost -U postgres -d jk002 -v ON_ERROR_STOP=1 -f supabase/migrations/20261004183758_jk002_ephemeral_table_messages.sql
          psql -h localhost -U postgres -d jk002 -v ON_ERROR_STOP=1 -f tests/integration/table-messages.sql
