name: TMP Materialize Reconciler Bundle

on:
  push:
    branches:
      - jk-006-presentation-sequencing-barrier

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[deploy-artifact]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jk-006-presentation-sequencing-barrier
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: |
          rm -rf .tmp-reconciler-deploy
          node scripts/build-reconciler.mjs .tmp-reconciler-deploy
          rm -f .tmp-reconciler-deploy/index.js.map .tmp-reconciler-deploy/manifest.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp-reconciler-deploy/index.js
          git commit -m "chore: materialize reconciler [deploy-artifact]"
          git push origin HEAD:jk-006-presentation-sequencing-barrier
