name: JK-001 Phase 8 Gate

on:
  workflow_call:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Tests
        id: tests
        continue-on-error: true
        run: bun run test
      - name: Phase 8 lint
        id: phase8_lint
        continue-on-error: true
        run: >-
          bunx eslint
          src/domain/gameState.ts
          src/domain/gameplayCommands.ts
          src/domain/gameplayCommands.test.ts
          src/domain/controller.ts
          src/domain/controller.test.ts
          src/bots/strategy.ts
          src/server/gameplayCommands.ts
          src/services/gameProjectionFunctions.ts
          --rule 'prettier/prettier: off'
      - name: Complete decision contract guard
        id: decision_contract
        continue-on-error: true
        run: |
          grep -q 'chooseDeclaration' src/bots/strategy.ts
          grep -q 'chooseTrump' src/bots/strategy.ts
          grep -q 'chooseCard' src/bots/strategy.ts
          grep -q 'chooseJokerSemantic' src/bots/strategy.ts
          grep -q 'type: "declare"' src/domain/gameplayCommands.ts
          grep -q 'type: "choose_trump"' src/domain/gameplayCommands.ts
          grep -q 'type: "play_card"' src/domain/gameplayCommands.ts
          grep -q 'type: "choose_joker_semantic"' src/domain/gameplayCommands.ts
      - name: Canonical engine reuse guard
        id: engine_reuse
        continue-on-error: true
        run: |
          grep -q 'applyDeclaration' src/domain/gameplayCommands.ts
          grep -q 'completeNineCardDeal' src/domain/gameplayCommands.ts
          grep -q 'legalMoves' src/domain/gameplayCommands.ts
          grep -q 'resolveTrick' src/domain/gameplayCommands.ts
          ! grep -q 'unrestrictedLegalMoves' src/domain/gameplayCommands.ts
      - name: Authenticated seat and controller guard
        id: auth_guard
        continue-on-error: true
        run: |
          grep -q 'seat: loaded.viewerSeat' src/server/gameplayCommands.ts
          grep -q 'expectedController: "human"' src/server/gameplayCommands.ts
          grep -q 'resolveOverdueTimeoutBeforeRead' src/server/gameplayCommands.ts
          ! grep -q 'seatIndex: z.number' src/services/gameProjectionFunctions.ts
          # Response projection metadata is valid; browser seat input is not.
          ! grep -Eq 'viewerSeat:[[:space:]]*z\.' src/services/gameProjectionFunctions.ts
      - name: Bot semantic command guard
        id: bot_command_guard
        continue-on-error: true
        run: |
          grep -q 'GameplayCommand | null' src/domain/controller.ts
          grep -q 'action: GameplayCommand' src/domain/controller.ts
          ! grep -q 'LocalLegalAction | null' src/domain/controller.ts
      - name: Dealer bootstrap remains outside gameplay command vocabulary
        id: bootstrap_guard
        continue-on-error: true
        run: |
          ! grep -q 'select_initial_dealer' src/domain/gameplayCommands.ts
          ! grep -q 'dealerSeat:' src/services/gameProjectionFunctions.ts
          ! grep -q 'firstRecipientSeat:' src/services/gameProjectionFunctions.ts
      - name: TypeScript
        id: typecheck
        continue-on-error: true
        run: bunx tsc --noEmit
      - name: Build
        id: build
        continue-on-error: true
        run: bun run build
      - name: Require Phase 8 gates
        if: always()
        run: |
          test "${{ steps.tests.outcome }}" = "success"
          test "${{ steps.phase8_lint.outcome }}" = "success"
          test "${{ steps.decision_contract.outcome }}" = "success"
          test "${{ steps.engine_reuse.outcome }}" = "success"
          test "${{ steps.auth_guard.outcome }}" = "success"
          test "${{ steps.bot_command_guard.outcome }}" = "success"
          test "${{ steps.bootstrap_guard.outcome }}" = "success"
          test "${{ steps.typecheck.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"
