name: JK-001 Phase 1 Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Tests
        run: bun test
      - name: Lint
        run: bun run lint
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: Build
        run: bun run build
